<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Physics Sath — Class 10 Study Companion</title>
<meta name="description" content="Ask questions from your Class 10 Physics textbook, in English, Urdu, Sindhi, or Roman Urdu." />
<meta name="theme-color" content="#1B4332" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<div class="app">
  <header class="app-header">
    <div class="header-tab">Unit 10&ndash;20</div>
    <div class="header-title">
      <h1>Physics Sath</h1>
      <p>Class 10 &middot; Sindh Textbook Board</p>
    </div>
  </header>

  <main id="chat" class="chat" aria-live="polite">
    <div class="welcome">
      <p class="welcome-lede">Poocho jo poochna hai — apni kitab se.</p>
      <p class="welcome-sub">Ask anything from Units 10&ndash;20: waves, sound, light, electricity, electronics, or nuclear physics. English, Urdu, Sindhi, or Roman Urdu — sab chalay ga.</p>
    </div>
  </main>

  <form id="composer" class="composer">
    <input
      id="question-input"
      type="text"
      autocomplete="off"
      placeholder="Apna sawal likho..."
      maxlength="500"
      aria-label="Type your physics question"
    />
    <button id="send-btn" type="submit" aria-label="Send question">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.5 10L17.5 2.5L12.5 17.5L10 11.5L2.5 10Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
    </button>
  </form>
</div>

<script src="/app.js"></script>
</body>
</html>
